services:
  - type: web
    name: campus-events-api
    runtime: docker
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: campus-events-db
          property: connectionString

databases:
  - name: campus-events-db
    databaseName: campus_events_prod
    plan: free
    region: oregon
